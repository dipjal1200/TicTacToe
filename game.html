
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe | TGR</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080f20;
    color: #fff;
    font-family: Arial, sans-serif;
}

.game {
    width: min(90%, 380px);
    padding: 25px;
    background: #101b32;
    border: 1px solid #263b5b;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 35px #0005;
}

h1 {
    color: #44bff0;
    margin-bottom: 8px;
}

.subtitle {
    color: #9eacc5;
    margin-bottom: 22px;
}

.status {
    margin-bottom: 18px;
    font-size: 18px;
    font-weight: bold;
    min-height: 22px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.cell {
    aspect-ratio: 1;
    border: 1px solid #304667;
    border-radius: 12px;
    background: #0a1428;
    color: #44bff0;
    font-size: 38px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.cell:hover:not(:disabled) {
    background: #192d49;
    border-color: #44bff0;
}

.cell:disabled {
    cursor: default;
}

.cell.o {
    color: #a78bfa;
}

.cell.winner {
    background: #164e63;
    border-color: #44bff0;
}

#restart {
    margin-top: 22px;
    padding: 12px 24px;
    border: none;
    border-radius: 9px;
    background: #44bff0;
    color: #08111f;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#restart:hover {
    background: #8bdcff;
}

</style>
</head>

<body>

<div class="game">
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">TGR Mini Games</p>

    <p class="status" id="status">Player X's turn</p>

    <div class="board" id="board">
        <button class="cell" aria-label="Cell 1"></button>
        <button class="cell" aria-label="Cell 2"></button>
        <button class="cell" aria-label="Cell 3"></button>
        <button class="cell" aria-label="Cell 4"></button>
        <button class="cell" aria-label="Cell 5"></button>
        <button class="cell" aria-label="Cell 6"></button>
        <button class="cell" aria-label="Cell 7"></button>
        <button class="cell" aria-label="Cell 8"></button>
        <button class="cell" aria-label="Cell 9"></button>
    </div>

    <button id="restart">Restart Game</button>
</div>

<script>
const cells = document.querySelectorAll(".cell");
const statusText = document.querySelector("#status");
const restartBtn = document.querySelector("#restart");

let currentPlayer = "X";
let gameActive = true;
let arr = ["", "", "", "", "", "", "", "", ""];

const winPatterns = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
];

function checkWinner() {
    for (const pattern of winPatterns) {
        const [a, b, c] = pattern;

        if (
            arr[a] &&
            arr[a] === arr[b] &&
            arr[a] === arr[c]
        ) {
            cells[a].classList.add("winner");
            cells[b].classList.add("winner");
            cells[c].classList.add("winner");

            statusText.textContent =
                `Player ${currentPlayer} wins!`;

            gameActive = false;
            cells.forEach(cell => cell.disabled = true);
            return true;
        }
    }

    if (arr.every(cell => cell !== "")) {
        statusText.textContent = "It's a draw!";
        gameActive = false;
        return true;
    }

    return false;
}

function handleClick(event) {
    const cell = event.currentTarget;
    const index = Array.from(cells).indexOf(cell);

    if (!gameActive || arr[index] !== "") {
        return;
    }

    arr[index] = currentPlayer;
    cell.textContent = currentPlayer;
    cell.classList.add(currentPlayer.toLowerCase());
    cell.disabled = true;

    if (checkWinner()) {
        return;
    }

    currentPlayer = currentPlayer === "X" ? "O" : "X";
    statusText.textContent = `Player ${currentPlayer}'s turn`;
}

function restartGame() {
    arr = ["", "", "", "", "", "", "", "", ""];
    currentPlayer = "X";
    gameActive = true;

    statusText.textContent = "Player X's turn";

    cells.forEach(cell => {
        cell.textContent = "";
        cell.disabled = false;
        cell.classList.remove("x", "o", "winner");
    });
}

cells.forEach(cell => {
    cell.addEventListener("click", handleClick);
});

restartBtn.addEventListener("click", restartGame);
</script>

</body>
</html>
